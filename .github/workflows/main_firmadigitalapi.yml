# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - firmadigitalapi

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build with dotnet
        run: dotnet build --configuration Release

      # Solo el API. Publicar la solución entera mete en la misma carpeta el
      # runtimeconfig.json de Infrastructure (declara FrameworkReference de ASP.NET Core), y con
      # dos candidatos App Service no sabe qué ensamblado arrancar: deja el contenedor de
      # bienvenida corriendo y toda ruta responde 404 aunque el despliegue diga correcto.
      - name: dotnet publish
        run: dotnet publish MobiControlFirma.API/MobiControlFirma.API.csproj -c Release -o ${{env.DOTNET_ROOT}}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  # Las migraciones se aplican antes de desplegar: si el esquema falla, el App Service se queda
  # con la versión anterior funcionando en vez de arrancar contra una base que no le corresponde.
  migrate:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Instalar dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 10.*

      # La carpeta obj/ está versionada y sus project.assets.json guardan rutas de Windows.
      # dotnet ef no restaura por su cuenta, así que sin esto lee esos archivos y muere
      # buscando la carpeta de paquetes de Visual Studio, que en el runner de Linux no existe.
      - name: Restaurar dependencias
        run: dotnet restore MobiControlFirma.sln

      # La cadena sale de appsettings.json, el mismo del commit que dispara el workflow: la base
      # queda siempre en el esquema de la versión que se está desplegando.
      - name: Aplicar migraciones a Azure SQL
        env:
          ASPNETCORE_ENVIRONMENT: Production
        run: |
          dotnet ef database update \
            --project MobiControlFirma.Infrastructure \
            --startup-project MobiControlFirma.API

  deploy:
    runs-on: ubuntu-latest
    needs: [build, migrate]

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'firmadigitalapi'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_A06969EB92CB4137BD6B4C0C9516B643 }}

      # TEMPORAL. El despliegue termina correcto pero el sitio nunca arranca lo desplegado:
      # sigue respondiendo el contenedor de bienvenida. Esto pregunta a Kudu si los archivos
      # llegaron a wwwroot y qué dice el arranque. Quitar cuando el API responda.
      - name: Diagnóstico Kudu
        if: always()
        env:
          PERFIL: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_A06969EB92CB4137BD6B4C0C9516B643 }}
        run: |
          CREDS=$(python3 -c "
          import os, xml.etree.ElementTree as ET
          raiz = ET.fromstring(os.environ['PERFIL'])
          perfil = [x for x in raiz.iter('publishProfile') if x.get('publishMethod') == 'MSDeploy'][0]
          print(perfil.get('publishUrl').split(':')[0])
          print(perfil.get('userName'))
          print(perfil.get('userPWD'))
          ")
          SCM=$(printf '%s\n' "$CREDS" | sed -n 1p)
          USUARIO=$(printf '%s\n' "$CREDS" | sed -n 2p)
          CLAVE=$(printf '%s\n' "$CREDS" | sed -n 3p)
          echo "::add-mask::$USUARIO"
          echo "::add-mask::$CLAVE"
          # Nada de esto debe imprimir contraseñas: el repositorio es público.
          CENSURA='s/[Pp]assword=[^;"]*/Password=***/g'

          echo "===== SCM: $SCM ====="

          echo "===== contenido de /home/site/wwwroot ====="
          curl -s -u "$USUARIO:$CLAVE" "https://$SCM/api/vfs/site/wwwroot/" | python3 -c "
          import json, sys
          try:
              datos = json.load(sys.stdin)
          except Exception:
              print('(respuesta no interpretable)'); raise SystemExit
          print('archivos:', len(datos))
          for i in sorted(datos, key=lambda x: x['name'])[:40]:
              print('  {:>12}  {}'.format(i.get('size', ''), i['name']))
          " || echo "(no se pudo listar wwwroot)"

          echo "===== /home/data/SitePackages (existe si corre desde paquete) ====="
          curl -s -o /dev/null -w "  http=%{http_code}\n" -u "$USUARIO:$CLAVE" \
            "https://$SCM/api/vfs/data/SitePackages/" || true

          echo "===== log de arranque del contenedor ====="
          HREF=$(curl -s -u "$USUARIO:$CLAVE" "https://$SCM/api/logs/docker" | python3 -c "
          import json, sys
          try:
              datos = json.load(sys.stdin)
          except Exception:
              datos = []
          datos.sort(key=lambda x: x.get('mtime', ''), reverse=True)
          print(datos[0]['href'] if datos else '')
          ")
          if [ -n "$HREF" ]; then
            curl -s -u "$USUARIO:$CLAVE" "$HREF" | sed "$CENSURA" | tail -80
          else
            echo "(sin logs de contenedor disponibles)"
          fi
