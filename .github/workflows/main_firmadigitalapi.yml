# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - firmadigitalapi

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build with dotnet
        run: dotnet build --configuration Release

      # Solo el API. Publicar la solución entera mete en la misma carpeta el
      # runtimeconfig.json de Infrastructure (declara FrameworkReference de ASP.NET Core), y con
      # dos candidatos App Service no sabe qué ensamblado arrancar: deja el contenedor de
      # bienvenida corriendo y toda ruta responde 404 aunque el despliegue diga correcto.
      - name: dotnet publish
        run: dotnet publish MobiControlFirma.API/MobiControlFirma.API.csproj -c Release -o ${{env.DOTNET_ROOT}}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  # Las migraciones se aplican antes de desplegar: si el esquema falla, el App Service se queda
  # con la versión anterior funcionando en vez de arrancar contra una base que no le corresponde.
  migrate:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Instalar dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 10.*

      # La carpeta obj/ está versionada y sus project.assets.json guardan rutas de Windows.
      # dotnet ef no restaura por su cuenta, así que sin esto lee esos archivos y muere
      # buscando la carpeta de paquetes de Visual Studio, que en el runner de Linux no existe.
      - name: Restaurar dependencias
        run: dotnet restore MobiControlFirma.sln

      # La cadena sale de appsettings.json, el mismo del commit que dispara el workflow: la base
      # queda siempre en el esquema de la versión que se está desplegando.
      - name: Aplicar migraciones a Azure SQL
        env:
          ASPNETCORE_ENVIRONMENT: Production
        run: |
          dotnet ef database update \
            --project MobiControlFirma.Infrastructure \
            --startup-project MobiControlFirma.API

  deploy:
    runs-on: ubuntu-latest
    needs: [build, migrate]

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'firmadigitalapi'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_A06969EB92CB4137BD6B4C0C9516B643 }}
